name: Prepare Wavebook site

on:
  push:
    branches: [main]
    paths:
      - '.github/wavebook-package/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-wavebook
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the complete website
        run: python3 .github/unpack-wavebook.py
      - name: Commit the verified website files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .nojekyll manifest.webmanifest pwa.js sw.js apple-touch-icon.png icon-192.png icon-512.png THIRD_PARTY_NOTICES.txt TESTING.md DEPLOYMENT.md
          if git diff --cached --quiet; then
            echo 'Website already matches the verified package.'
          else
            git commit -m 'Publish complete Wavebook app, embedded report, and offline assets'
            git push origin HEAD:main
          fi
