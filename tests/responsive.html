<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wavebook responsive review</title><style>body{font:15px system-ui;background:#e9eef3;color:#182837;padding:20px;margin:0}h1{font-size:24px}p{max-width:760px;line-height:1.6}.frames{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}section{max-width:100%}iframe{display:block;border:1px solid #667c92;border-radius:12px;background:#0b1018;max-width:100%}button,select{font:inherit;padding:10px;min-height:44px;margin:8px 8px 16px 0}label{display:block}</style></head><body><h1>Wavebook responsive review</h1><p>The two frames exercise the real app at phone and tablet widths. Preview progress uses a separate save key and does not overwrite normal Wavebook progress.</p><label>Review view <select id="view"><option value="overview">Home</option><option value="roster">Roster</option><option value="teams">Team planner</option><option value="character/jingran/progress">Jingran build check</option><option value="rotation">Rotation lab</option><option value="planner">Upgrade queue</option></select></label><div class="frames"><section><h2>Phone · 390 × 844</h2><iframe id="phone" title="Wavebook phone preview" width="390" height="844" src="../index.html?preview=1#overview"></iframe></section><section><h2>Tablet · 768 × 1024</h2><iframe id="tablet" title="Wavebook tablet preview" width="768" height="1024" src="../index.html?preview=1#overview"></iframe></section></div><script>document.getElementById('view').addEventListener('change',e=>{for(const id of ['phone','tablet'])document.getElementById(id).src='../index.html?preview=1#'+e.target.value;});</script></body></html>
